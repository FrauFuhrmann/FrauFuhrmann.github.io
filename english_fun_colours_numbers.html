<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Fun – Colours & Numbers</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e9f7ff,#fff6dc);color:#243447}
header{text-align:center;padding:24px 16px 12px}
h1{font-size:clamp(30px,6vw,52px);margin:0 0 8px;color:#2457a6}
.subtitle{font-size:18px;margin:0 0 8px}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px auto 20px}
nav button,.bigbutton{border:0;border-radius:18px;padding:13px 20px;font-size:18px;font-weight:bold;cursor:pointer;background:#fff;box-shadow:0 4px 10px #0002}
nav button.active{background:#2457a6;color:white}
main{max-width:1050px;margin:auto;padding:0 16px 40px}
.section{display:none}.section.active{display:block}
.card{background:#ffffffdd;border-radius:26px;padding:22px;box-shadow:0 8px 24px #0002;margin-bottom:20px}
h2{text-align:center;font-size:30px;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.wordcard{border:0;border-radius:20px;padding:14px;background:white;box-shadow:0 4px 12px #0002;cursor:pointer;font-size:20px;font-weight:bold}
.swatch{height:80px;border-radius:15px;margin-bottom:9px}
.numbercard{background:#f4f7ff;border:3px solid #dce5ff;border-radius:20px;padding:18px;font-size:30px;font-weight:bold;cursor:pointer}
.numbercard small{display:block;font-size:17px;margin-top:5px;color:#555}
.quiz{text-align:center}
.question{font-size:30px;font-weight:bold;margin:18px 0}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.answer{border:0;border-radius:18px;padding:18px;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 4px 10px #0002;background:white}
.feedback{min-height:35px;font-size:22px;font-weight:bold;margin:16px}
.score{font-size:20px;background:#fff3a8;border-radius:16px;padding:10px;display:inline-block}
.reset{margin-top:15px;background:#ffcf5c}
footer{text-align:center;font-size:14px;padding:20px;color:#667}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.question{font-size:25px}}
</style>
</head>
<body>
<header>
<h1>🌈 English Fun! 🔢</h1>
<p class="subtitle">Practise <b>colours</b> and <b>numbers 1–20</b> in English!</p>
<nav>
<button class="active" onclick="showSection('learnColours',this)">🌈 Colours</button>
<button onclick="showSection('learnNumbers',this)">🔢 Numbers</button>
<button onclick="showSection('colourQuiz',this)">🎨 Colour Quiz</button>
<button onclick="showSection('numberQuiz',this)">🎯 Number Quiz</button>
</nav>
</header>

<main>
<section id="learnColours" class="section active">
<div class="card">
<h2>🌈 Colours</h2>
<p style="text-align:center">Click a colour to hear it!</p>
<div class="grid" id="colourGrid"></div>
</div>
</section>

<section id="learnNumbers" class="section">
<div class="card">
<h2>🔢 Numbers 1–20</h2>
<p style="text-align:center">Click a number to hear it!</p>
<div class="grid" id="numberGrid"></div>
</div>
</section>

<section id="colourQuiz" class="section">
<div class="card quiz">
<h2>🎨 Colour Quiz</h2>
<div class="score">⭐ Score: <span id="colourScore">0</span></div>
<div class="question" id="colourQuestion"></div>
<div class="answers" id="colourAnswers"></div>
<div class="feedback" id="colourFeedback"></div>
<button class="bigbutton reset" onclick="newColourQuestion()">🔄 New question</button>
</div>
</section>

<section id="numberQuiz" class="section">
<div class="card quiz">
<h2>🎯 Number Quiz</h2>
<div class="score">⭐ Score: <span id="numberScore">0</span></div>
<div class="question" id="numberQuestion"></div>
<div class="answers" id="numberAnswers"></div>
<div class="feedback" id="numberFeedback"></div>
<button class="bigbutton reset" onclick="newNumberQuestion()">🔄 New question</button>
</div>
</section>
</main>

<footer>Have fun learning English! 🇬🇧⭐</footer>

<script>
const colours=[
["red","#ef4444"],["blue","#3b82f6"],["green","#22c55e"],["yellow","#facc15"],
["orange","#f97316"],["purple","#a855f7"],["pink","#ec4899"],["brown","#92400e"],
["black","#111827"],["white","#ffffff"],["grey","#9ca3af"],["turquoise","#14b8a6"]
];
const numbers=["one","two","three","four","five","six","seven","eight","nine","ten",
"eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];

function speak(text){
 if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(text);
   u.lang="en-GB"; u.rate=.82;
   speechSynthesis.speak(u);
 }
}

function showSection(id,btn){
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 if(id==="colourQuiz") newColourQuestion();
 if(id==="numberQuiz") newNumberQuestion();
}

const cg=document.getElementById("colourGrid");
colours.forEach(([name,color])=>{
 const b=document.createElement("button"); b.className="wordcard";
 b.innerHTML=`<div class="swatch" style="background:${color};${name==="white"?"border:2px solid #bbb":""}"></div>${name}`;
 b.onclick=()=>speak(name);
 cg.appendChild(b);
});

const ng=document.getElementById("numberGrid");
numbers.forEach((word,i)=>{
 const b=document.createElement("button"); b.className="numbercard";
 b.innerHTML=`${i+1}<small>${word}</small>`;
 b.onclick=()=>speak(word);
 ng.appendChild(b);
});

let colourScore=0, numberScore=0, currentColour="", currentNumber=0;

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function newColourQuestion(){
 const item=colours[Math.floor(Math.random()*colours.length)];
 currentColour=item[0];
 document.getElementById("colourQuestion").textContent="Which colour is it? 🔊";
 speak(currentColour);
 const choices=shuffle([item,...shuffle(colours.filter(x=>x[0]!==currentColour)).slice(0,3)]);
 const box=document.getElementById("colourAnswers"); box.innerHTML="";
 document.getElementById("colourFeedback").textContent="";
 choices.forEach(([name,color])=>{
   const b=document.createElement("button"); b.className="answer";
   b.innerHTML=`<span style="display:inline-block;width:35px;height:35px;border-radius:50%;vertical-align:middle;background:${color};${name==="white"?"border:2px solid #aaa":""}"></span><br>${name}`;
   b.onclick=()=>checkColour(name);
   box.appendChild(b);
 });
}
function checkColour(name){
 const f=document.getElementById("colourFeedback");
 if(name===currentColour){colourScore++;document.getElementById("colourScore").textContent=colourScore;f.textContent="🎉 Great! Well done!";}
 else f.textContent="😊 Try again!";
 speak(currentColour);
 setTimeout(newColourQuestion,850);
}

function newNumberQuestion(){
 currentNumber=Math.floor(Math.random()*20)+1;
 document.getElementById("numberQuestion").textContent=`Which number is "${numbers[currentNumber-1]}"? 🔊`;
 speak(numbers[currentNumber-1]);
 const choices=shuffle([currentNumber,...shuffle([...Array(20)].map((_,i)=>i+1).filter(n=>n!==currentNumber)).slice(0,3)]);
 const box=document.getElementById("numberAnswers"); box.innerHTML="";
 document.getElementById("numberFeedback").textContent="";
 choices.forEach(n=>{
   const b=document.createElement("button"); b.className="answer"; b.textContent=n;
   b.onclick=()=>checkNumber(n);
   box.appendChild(b);
 });
}
function checkNumber(n){
 const f=document.getElementById("numberFeedback");
 if(n===currentNumber){numberScore++;document.getElementById("numberScore").textContent=numberScore;f.textContent="🎉 Excellent!";}
 else f.textContent="😊 Try again!";
 speak(numbers[currentNumber-1]);
 setTimeout(newNumberQuestion,850);
}
</script>
</body>
</html>
